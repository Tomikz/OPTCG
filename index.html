<style>
  html, body { margin: 0; min-height: 100%; background: #061224; color: #eaf2ff; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  body {
    font-family: Barlow, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(120% 55% at 50% -12%, rgba(245,184,46,.13), transparent 60%),
      radial-gradient(90% 50% at 110% 110%, rgba(58,120,200,.18), transparent 60%),
      linear-gradient(180deg, #0b1f3a 0%, #061224 70%);
    background-attachment: fixed;
  }
  .font-display { letter-spacing: .03em; }
  button { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }

  /* --- Flip 3D --- */
  .flip-scene { perspective: 1000px; }
  .flip-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.2,.8,.25,1); }
  .flip-inner.is-flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face-front { transform: rotateY(180deg); background: #0d1b33; }
  .info-in { animation: infoIn .35s ease-out both; }
  @keyframes infoIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* --- Dos de carte --- */
  .card-back {
    background:
      repeating-linear-gradient(45deg, rgba(245,184,46,.05) 0 2px, transparent 2px 9px),
      radial-gradient(circle at 50% 45%, #1d3563 0%, #0e1d3d 55%, #071126 100%);
    border: 2px solid #c79a3a;
    border-radius: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.45);
  }

  /* --- Effets de rareté --- */
  .fx-sr { animation: glowSR 1.7s ease-in-out infinite; overflow: hidden; }
  @keyframes glowSR {
    0%,100% { box-shadow: 0 0 0 2px #f5b82e, 0 0 14px 3px rgba(245,184,46,.55); }
    50%     { box-shadow: 0 0 0 2px #fde68a, 0 0 28px 8px rgba(245,184,46,.9); }
  }
  .fx-sec { animation: glowSEC 2.2s linear infinite; }
  @keyframes glowSEC {
    0%   { box-shadow: 0 0 0 2px #f0abfc, 0 0 26px 7px rgba(240,171,252,.85); }
    33%  { box-shadow: 0 0 0 2px #fde047, 0 0 30px 9px rgba(253,224,71,.85); }
    66%  { box-shadow: 0 0 0 2px #67e8f9, 0 0 26px 7px rgba(103,232,249,.85); }
    100% { box-shadow: 0 0 0 2px #f0abfc, 0 0 26px 7px rgba(240,171,252,.85); }
  }
  .fx-manga { animation: glowManga 1.1s ease-in-out infinite; }
  @keyframes glowManga {
    0%,100% { box-shadow: 0 0 0 3px #fff7d6, 0 0 30px 10px rgba(255,215,90,.95), 0 0 70px 20px rgba(245,184,46,.45); }
    50%     { box-shadow: 0 0 0 3px #f5b82e, 0 0 44px 16px rgba(255,236,160,1), 0 0 110px 34px rgba(245,184,46,.6); }
  }
  .fx-sr::after, .fx-sec::after, .fx-manga::after {
    content: ""; position: absolute; inset: -30%; pointer-events: none; z-index: 2;
    background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,.55) 50%, transparent 58%);
    transform: translateX(-110%); animation: shine 2.8s ease-in-out .5s infinite;
  }
  .fx-sec::after { background: linear-gradient(115deg, transparent 38%, rgba(240,171,252,.45) 46%, rgba(255,255,255,.6) 50%, rgba(103,232,249,.45) 54%, transparent 62%); animation-duration: 2.2s; }
  @keyframes shine { 0% { transform: translateX(-110%); } 55%,100% { transform: translateX(110%); } }

  .shake-once { animation: shake .7s cubic-bezier(.36,.07,.19,.97) .5s both; }
  @keyframes shake {
    10%,90% { transform: translateX(-2px) rotate(-1deg); } 20%,80% { transform: translateX(4px) rotate(1.5deg); }
    30%,50%,70% { transform: translateX(-6px) rotate(-2deg) scale(1.03); } 40%,60% { transform: translateX(6px) rotate(2deg) scale(1.03); }
  }

  .chip-aa { background: linear-gradient(90deg, #7c3aed, #2563eb, #06b6d4); }
  .chip-sp { background: linear-gradient(90deg, #e5e7eb, #f8fafc, #cbd5e1); }
  .chip-seca { background: linear-gradient(90deg, #fbbf24, #f472b6, #a78bfa, #fbbf24); background-size: 200% 100%; animation: seca 2.4s linear infinite; }
  @keyframes seca { to { background-position: -200% 0; } }
  .fx-aa { animation: glowAA 2s ease-in-out infinite; }
  @keyframes glowAA {
    0%,100% { box-shadow: 0 0 0 2px #a78bfa, 0 0 20px 5px rgba(124,58,237,.7); }
    50%     { box-shadow: 0 0 0 2px #67e8f9, 0 0 28px 8px rgba(6,182,212,.75); }
  }
  .fx-aa::after { content: ""; position: absolute; inset: -30%; pointer-events: none; z-index: 2;
    background: linear-gradient(115deg, transparent 40%, rgba(167,139,250,.45) 47%, rgba(255,255,255,.55) 50%, rgba(103,232,249,.45) 53%, transparent 60%);
    transform: translateX(-110%); animation: shine 2.4s ease-in-out .5s infinite; }
  .tile-aa { box-shadow: 0 0 0 1.5px #a78bfa, 0 0 12px rgba(124,58,237,.5); }
  .pack-glow { position: absolute; inset: -12%; filter: blur(34px); opacity: .8; }
  .chip-sec { background: linear-gradient(90deg, #f0abfc, #fde047, #67e8f9); }
  .tile-sr { box-shadow: 0 0 0 1.5px #f5b82e, 0 0 10px rgba(245,184,46,.45); }
  .tile-sec { box-shadow: 0 0 0 1.5px #f0abfc, 0 0 12px rgba(240,171,252,.55); }
  .tile-manga { box-shadow: 0 0 0 2px #fde68a, 0 0 16px rgba(255,215,90,.8); }
  .missing img { filter: grayscale(1) brightness(.55) contrast(.9); opacity: .75; }
  .catalog-tile { content-visibility: auto; contain-intrinsic-size: 110px 180px; }

  /* --- Booster --- */
  .pack { position: relative; width: min(56vw, 210px); aspect-ratio: 5 / 8; border-radius: 10px; overflow: hidden;
    box-shadow: 0 24px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.18); }
  .pack::before, .pack::after { content: ""; position: absolute; left: 0; right: 0; height: 12px; z-index: 11;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 3px, rgba(0,0,0,.15) 3px 6px); }
  .pack::before { top: 0; } .pack::after { bottom: 0; }
  .pack-foil { position: absolute; inset: 0; z-index: 1; mix-blend-mode: overlay;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 45%, rgba(255,230,150,.35) 52%, transparent 65%);
    background-size: 250% 100%; animation: foil 3.6s ease-in-out infinite; }
  @keyframes foil { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
  .pack-idle { animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-8px) rotate(1.5deg); } }
  .pack-rip { animation: rip 1.1s ease-in forwards, ripWait .9s ease-in-out 1.1s infinite; }
  @keyframes ripWait { 0%,100% { opacity: .25; transform: scale(1.2); } 50% { opacity: .5; transform: scale(1.24); } }
  @keyframes rip {
    0% { transform: none; } 15% { transform: rotate(-5deg) scale(1.03); } 30% { transform: rotate(5deg) scale(1.05); }
    45% { transform: rotate(-4deg) scale(1.07); } 60% { transform: rotate(3deg) scale(1.1); filter: brightness(1.4); }
    100% { transform: scale(1.35) translateY(-20px); opacity: 0; filter: brightness(2.6); }
  }
  .open-btn { background: linear-gradient(180deg, #ffd66b 0%, #f5b82e 55%, #d9921a 100%);
    box-shadow: 0 4px 0 #8a5a0c, 0 14px 30px rgba(245,184,46,.3); }
  .open-btn:active { box-shadow: 0 1px 0 #8a5a0c, 0 6px 16px rgba(245,184,46,.25); transform: translateY(3px); }

  /* --- Entrées & overlays --- */
  .deal-in { animation: dealIn .55s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes dealIn { from { opacity: 0; transform: translateY(40px) scale(.8) rotate(-6deg); } to { opacity: 1; transform: none; } }
  .pop-in { animation: popIn .5s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes popIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
  .toast-in { animation: toastIn 2.2s ease both; }
  @keyframes toastIn { 0% { opacity: 0; transform: translateY(-16px) scale(.9); } 12%,85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
  .rays { position: absolute; left: 50%; top: 45%; width: 240vmax; height: 240vmax; margin: -120vmax 0 0 -120vmax;
    background: repeating-conic-gradient(from 0deg, rgba(245,184,46,.25) 0deg 7deg, transparent 7deg 18deg);
    animation: spin 16s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .manga-title { text-shadow: 0 4px 0 #8a2a0c, 0 0 30px rgba(255,215,90,.8); animation: titlePulse 1s ease-in-out infinite; }
  @keyframes titlePulse { 50% { transform: scale(1.06) rotate(-2deg); } }
  .skeleton { background: linear-gradient(100deg, #0d1b33 30%, #17305a 50%, #0d1b33 70%); background-size: 220% 100%; animation: skel 1.2s linear infinite; }
  @keyframes skel { from { background-position: 120% 0; } to { background-position: -120% 0; } }

  @media (prefers-reduced-motion: reduce) {
    .pack-idle, .pack-foil, .rays, .manga-title, .skeleton { animation: none !important; }
    .deal-in, .pop-in { animation-duration: .01s !important; }
    .flip-inner { transition-duration: .2s; }
  }

  .sheet-in { animation: sheetIn .28s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes sheetIn { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  input, textarea { font-size: 16px; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  #boot .boot-title { font-family: Bangers, Impact, sans-serif; font-size: 30px; color: #f5b82e; letter-spacing: .04em; margin: 0; }
  #boot .boot-help { max-width: 320px; margin: 0; font-size: 14px; line-height: 1.5; color: #cbd5e1; opacity: 0; animation: bootHelp .4s ease 5s forwards; }
  #boot .boot-error { max-width: 320px; margin: 0; font-size: 12px; color: #fda4af; }
  @keyframes bootHelp { to { opacity: 1; } }

  .hit-share { background: radial-gradient(120% 90% at 50% 0%, rgba(245,184,46,.22), rgba(225,29,72,.10) 60%, rgba(0,0,0,.25)); box-shadow: inset 0 0 0 1px rgba(245,184,46,.45); }

  .chip-tr { background: linear-gradient(90deg, #7f1d1d, #dc2626, #f59e0b, #dc2626, #7f1d1d); background-size: 200% 100%; animation: seca 2s linear infinite; }
  .chip-grail { background: linear-gradient(90deg, #3b2204, #a16207, #fde68a, #a16207, #3b2204); background-size: 200% 100%; animation: seca 2.2s linear infinite; }
  /* --- Grande animation de hit --- */
  .hit-rays { position: absolute; left: 50%; top: 42%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; animation: spin 9s linear infinite; opacity: 0; animation-fill-mode: both; }
  .hit-rays { animation: spin 9s linear infinite, raysIn .6s ease-out .15s both; }
  .hit-rays-rev { animation: spinRev 14s linear infinite, raysIn .8s ease-out .3s both; }
  @keyframes spinRev { to { transform: rotate(-360deg); } }
  @keyframes raysIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; } }
  .hit-flash { animation: hitFlash .55s ease-out both; pointer-events: none; }
  @keyframes hitFlash { 0% { opacity: .95; } 100% { opacity: 0; } }
  .hit-flash-soft { animation: hitFlashSoft 1.2s ease-out both; }
  @keyframes hitFlashSoft { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
  .hit-shake { animation: hitShake .5s cubic-bezier(.36,.07,.19,.97) .55s both; }
  @keyframes hitShake { 10%,90% { transform: translate(-2px,1px); } 20%,80% { transform: translate(5px,-2px); } 30%,50%,70% { transform: translate(-8px,3px); } 40%,60% { transform: translate(8px,-3px); } }
  .hit-card { animation: hitCard 1.05s cubic-bezier(.2,1.25,.35,1) .1s both, hitFloat 3s ease-in-out 1.3s infinite; transform-style: preserve-3d; }
  @keyframes hitCard { 0% { opacity: 0; transform: scale(.15) rotateY(720deg) rotateZ(-25deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes hitFloat { 0%,100% { transform: translateY(0) rotateY(-6deg); } 50% { transform: translateY(-10px) rotateY(6deg); } }
  .hit-holo { background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.7) 48%, rgba(255,230,150,.45) 52%, transparent 65%); background-size: 300% 100%; mix-blend-mode: overlay; animation: holoSweep 2.2s ease-in-out 1.1s infinite; }
  @keyframes holoSweep { 0% { background-position: 150% 0; } 100% { background-position: -150% 0; } }
  .hit-title { animation: hitTitle .6s cubic-bezier(.2,1.6,.4,1) .75s both, titlePulse 1.2s ease-in-out 1.4s infinite; }
  @keyframes hitTitle { from { opacity: 0; transform: scale(3.2) rotate(-6deg); } to { opacity: 1; transform: none; } }
  .hit-title-small { animation: hitSmall 1.5s ease-out both; }
  @keyframes hitSmall { 0% { opacity: 0; transform: scale(2.4); } 20% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
  .hit-sub { animation: infoIn .5s ease-out 1s both; }
  /* --- Visionneuse plein écran --- */
  .viewer-in { animation: viewerIn .3s ease-out both; }
  @keyframes viewerIn { from { opacity: 0; } to { opacity: 1; } }
  .viewer-float { animation: viewerFloat 4s ease-in-out infinite; }
  @keyframes viewerFloat { 0%,100% { transform: rotateY(-8deg) rotateX(3deg) translateY(0); } 50% { transform: rotateY(8deg) rotateX(-3deg) translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .hit-shake, .hit-rays, .hit-card, .viewer-float { animation: none !important; } }
  .chip-gold { background: linear-gradient(90deg, #d4d4d8, #fde68a, #f59e0b, #fde68a, #e5e7eb); background-size: 200% 100%; animation: seca 2s linear infinite; }
  /* --- Podium --- */
  .podium-1 { background: linear-gradient(180deg, #fde68a, #b45309); }
  .podium-2 { background: linear-gradient(180deg, #f1f5f9, #64748b); }
  .podium-3 { background: linear-gradient(180deg, #fdba74, #9a3412); }
  .podium-in { animation: podiumIn .7s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes podiumIn { from { opacity: 0; transform: translateY(24px) scale(.9); } to { opacity: 1; transform: none; } }
  .chip-red { background: linear-gradient(90deg, #7f1d1d, #ef4444, #fca5a5, #ef4444, #7f1d1d); background-size: 200% 100%; animation: seca 2s linear infinite; }
</style>
</head>
<body>
<div id="root">
  <div id="boot">
    <p class="boot-title">Hissez les voiles…</p>
    <p class="boot-help">Si ce message reste affiché, ouvre le lien dans Safari ou Chrome (pas dans l'aperçu d'une autre appli).</p>
    <p class="boot-error" id="boot-error"></p>
  </div>
</div>
<script>
  window.addEventListener("error", function (e) {
    if (window.__APP_STARTED__) return;
    var el = document.getElementById("boot-error");
    if (el) el.textContent = "Erreur au démarrage : " + (e.message || "inconnue");
  });
</script>
